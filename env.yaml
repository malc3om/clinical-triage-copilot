name: "Surgical"
version: "2.0.0"
description: "A high-fidelity clinical triage environment simulating mass casualty, STEMI, and sepsis scenarios with dynamic vitals deterioration."
author: "SURGICAL"
tags: ["clinical", "triage", "healthcare", "ai-agents", "real-world"]

tasks:
  - id: task_stemi_code
    difficulty: easy
    description: "Immediate recognition and activation of the cardiac catheterization lab."
    max_steps: 20
  - id: task_chest_pain_workup
    difficulty: medium
    description: "Differential diagnosis of pulmonary embolism vs. stable angina."
    max_steps: 20
  - id: task_mci_surge
    difficulty: hard
    description: "Mass Casualty Incident requiring triage of 5 patients under resource scarcity."
    max_steps: 20
  - id: task_sepsis_alert
    difficulty: medium
    description: "Septic shock presentation. Agent must recognize sepsis, order lactate, initiate fluid resuscitation, and administer antibiotics within the care bundle window."
    max_steps: 20
  - id: task_stroke_code
    difficulty: hard
    description: "Acute ischemic stroke. Agent must fast-track CT Head imaging, calculate NIHSS, and activate stroke pathway within door-to-CT time window."
    max_steps: 20
  - id: task_pediatric_resp
    difficulty: medium
    description: "Pediatric severe asthma exacerbation. Agent must assess peak flow, initiate nebulized albuterol, and manage escalation to PICU if no improvement."
    max_steps: 18

baseline_scores:
  task_stemi_code: 0.72
  task_chest_pain_workup: 0.48
  task_mci_surge: 0.31
  task_sepsis_alert: 0.60
  task_stroke_code: 0.55
  task_pediatric_resp: 0.65

entry_point: "server:app"
port: 7860
docker:
  build: "."
  run: ""
